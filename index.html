  <!-- Bild-Popup -->
  <dialog id="lightbox" aria-label="Bildansicht">
    <button class="schliessen" aria-label="Schließen">×</button>
    <img src="" alt="">
    <p class="bildtext"></p>
  </dialog>

  <script>
    /* ----- Bild-Popup ----- */
    const lightbox = document.getElementById('lightbox');
    const grossBild = lightbox.querySelector('img');
    const bildtext = lightbox.querySelector('.bildtext');

    document.querySelectorAll('.raster img').forEach(img => {
      img.tabIndex = 0;
      const oeffnen = () => {
        grossBild.src = img.src;
        grossBild.alt = img.alt;
        const caption = img.closest('figure').querySelector('figcaption');
        bildtext.textContent = caption ? caption.textContent : '';
        lightbox.showModal();
      };
      img.addEventListener('click', oeffnen);
      img.addEventListener('keydown', e => { if (e.key === 'Enter') oeffnen(); });
    });

    lightbox.addEventListener('click', () => lightbox.close());

    /* ----- Sommer / Winter ----- */
    const schalter = document.getElementById('winter-schalter');
    const setzeModus = winter => {
      document.body.classList.toggle('winter-modus', winter);
      schalter.checked = winter;
    };

    try { setzeModus(localStorage.getItem('jahreszeit') === 'winter'); } catch (e) {}

    schalter.addEventListener('change', () => {
      setzeModus(schalter.checked);
      try { localStorage.setItem('jahreszeit', schalter.checked ? 'winter' : 'sommer'); } catch (e) {}
    });
  </script>
